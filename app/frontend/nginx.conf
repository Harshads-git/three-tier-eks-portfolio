user  nginx;

# worker_processes: Number of Nginx worker processes.
# 'auto' = one worker per CPU core (optimal for most workloads).
# In a K8s pod with 0.5 CPU limit, this effectively = 1 worker.
worker_processes  auto;

# Error log — in containers, log to stderr so Docker/K8s captures it.
# Kubernetes collects logs from stdout/stderr via its logging driver.
error_log  /var/log/nginx/error.log warn;

# pid file — stores the Nginx master process PID.
pid        /var/run/nginx.pid;

events {
    # worker_connections: Max simultaneous connections per worker.
    # Total max connections = worker_processes × worker_connections
    # 1024 is a good default for a containerized app behind a load balancer.
    worker_connections  1024;
}

http {
    # ─────────────────────────────────────────────────────────────────────
    # MIME TYPES
    # ─────────────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    # Default MIME type for files not in mime.types
    default_type  application/octet-stream;

    # ─────────────────────────────────────────────────────────────────────
    # LOGGING — Container-Friendly Format
    # ─────────────────────────────────────────────────────────────────────
    # Log to stdout/stderr so Kubernetes can collect logs via:
    #   kubectl logs <pod> -n three-tier
    # Or via CloudWatch Container Insights (Day 25)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # ─────────────────────────────────────────────────────────────────────
    # PERFORMANCE SETTINGS
    # ─────────────────────────────────────────────────────────────────────
    # sendfile: Use kernel's sendfile() for static file serving.
    # More efficient than read() + write() — bypasses user space.
    sendfile        on;

    # tcp_nopush: Send HTTP headers and file data in one TCP packet.
    # Works with sendfile — reduces number of packets sent.
    tcp_nopush      on;

    # keepalive_timeout: How long to keep idle connections open.
    # 65s is a good balance between connection reuse and resource usage.
    # ALB also has its own keepalive timeout — match or set lower than ALB's.
    keepalive_timeout  65;

    # ─────────────────────────────────────────────────────────────────────
    # GZIP COMPRESSION
    # ─────────────────────────────────────────────────────────────────────
    # Compress text-based responses (HTML, CSS, JS, JSON) before sending.
    # React builds are typically 300KB+. With gzip, they compress to ~80KB.
    # This significantly reduces load time, especially on mobile networks.
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;        # Don't compress tiny files (overhead not worth it)
    gzip_proxied any;            # Compress even for proxied requests
    gzip_comp_level 6;           # Compression level (1=fastest, 9=best compression)
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ─────────────────────────────────────────────────────────────────────
    # SECURITY HEADERS
    # ─────────────────────────────────────────────────────────────────────
    # Hide Nginx version from error pages and response headers.
    # Reduces information disclosure to potential attackers.
    server_tokens off;

    # ─────────────────────────────────────────────────────────────────────
    # SERVER BLOCK
    # ─────────────────────────────────────────────────────────────────────
    server {
        # Listen on port 80 (HTTP).
        # In K8s: the Service exposes this port. TLS termination happens at the ALB.
        # The ALB handles HTTPS → forwards plain HTTP to Nginx (port 80 inside cluster).
        listen       80;
        server_name  _;  # Matches any hostname (appropriate for containerized service)

        # ─────────────────────────────────────────────────────────────────
        # SECURITY HEADERS
        # ─────────────────────────────────────────────────────────────────
        # X-Frame-Options: Prevents clickjacking attacks (iframe embedding)
        add_header X-Frame-Options "SAMEORIGIN" always;

        # X-Content-Type-Options: Prevents MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # X-XSS-Protection: Enables browser's XSS filter (legacy, modern browsers use CSP)
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer-Policy: Controls what's sent in Referer header
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─────────────────────────────────────────────────────────────────
        # STATIC FILES — React Build Output
        # ─────────────────────────────────────────────────────────────────
        # Root directory: where npm run build output is copied in the Dockerfile.
        # All static assets (JS, CSS, HTML, images) are served from here.
        root   /usr/share/nginx/html;

        # Default file to serve when a directory is requested
        index  index.html;

        # ─────────────────────────────────────────────────────────────────
        # STATIC ASSET CACHING (Long-term cache for versioned files)
        # ─────────────────────────────────────────────────────────────────
        # React's build process appends content hashes to filenames:
        #   main.abc123.js, main.def456.css
        # These hashes change when content changes, so we can safely
        # cache them "forever" (1 year). Browsers re-download automatically
        # when the hash in index.html changes after deployment.
        #
        # This dramatically improves load time for repeat visitors:
        # On first visit: download all assets
        # On revisit after non-deployment: serve from browser cache (instant)
        # On revisit after deployment: new hashes → fresh download
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Try to serve the file; return 404 if not found (no fallback to index.html)
            try_files $uri =404;
        }

        # ─────────────────────────────────────────────────────────────────
        # SPA ROUTING — The most critical Nginx config for React
        # ─────────────────────────────────────────────────────────────────
        # React Router handles routing CLIENT-SIDE. The server only has index.html.
        #
        # Without this, navigating to /tasks directly returns 404 because:
        #   Nginx looks for file: /usr/share/nginx/html/tasks (doesn't exist)
        #
        # With try_files:
        #   $uri → Try to serve the exact file requested
        #          (e.g., /static/js/main.abc123.js → file exists → serve it)
        #   $uri/ → Try the path as a directory
        #          (rarely needed for SPAs)
        #   /index.html → Fallback: serve index.html for any unmatched path
        #          (e.g., /tasks → no file exists → serve index.html →
        #           React Router sees /tasks → renders Tasks component)
        #
        # ⚠️  WITHOUT THIS, your React app works on / but 404s on all other routes!
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─────────────────────────────────────────────────────────────────
        # HEALTH CHECK ENDPOINT
        # ─────────────────────────────────────────────────────────────────
        # Serves a simple 200 OK for Nginx health.
        # Used by docker-compose healthcheck and K8s readinessProbe
        # (for the frontend service specifically).
        location /nginx-health {
            access_log off;   # Don't log health check hits (reduces noise)
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ─────────────────────────────────────────────────────────────────
        # ERROR PAGES
        # ─────────────────────────────────────────────────────────────────
        # For 404 and 50x errors, serve index.html instead of Nginx's default
        # HTML error page. React can render a proper error UI.
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
