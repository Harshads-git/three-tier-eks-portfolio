name: Load Tests — k6 Performance Validation

# ─────────────────────────────────────────────────────────────────────────────
# WHEN THIS RUNS:
# ─────────────────────────────────────────────────────────────────────────────
# - Weekly schedule (Sunday midnight): Automated regression check
# - Manual trigger: workflow_dispatch for ad-hoc load testing
# - NOT on every PR/push: load tests take 15-20 minutes and cost cluster resources
#
# PREREQUISITES:
# - EKS cluster running (terraform apply completed)
# - Application deployed (cd.yml ran successfully)
# - ALB DNS name set in GitHub Secrets
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 18 * * 0"   # Every Sunday at 18:30 UTC (midnight IST)
    # Sunday midnight: cluster usage is lowest, good time for load tests

  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of test to run"
        required: true
        type: choice
        options:
          - smoke
          - load
          - stress
          - hpa-validation
      base_url:
        description: "Target URL (overrides ALB_DNS secret)"
        required: false

permissions:
  id-token: write    # OIDC for AWS
  contents: read
  issues: write      # Create issue on test failure

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: three-tier-eks-cluster
  K6_VERSION: v0.51.0

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: SMOKE TEST (always runs first)
  # ─────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    outputs:
      smoke_passed: ${{ steps.run-smoke.outcome == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Set target URL
        id: set-url
        run: |
          BASE_URL="${{ github.event.inputs.base_url || format('http://{0}', secrets.ALB_DNS) }}"
          echo "base_url=${BASE_URL}" >> $GITHUB_OUTPUT
          echo "Testing against: ${BASE_URL}"

      - name: Run smoke test
        id: run-smoke
        run: |
          mkdir -p results
          k6 run k6/load-tests/smoke-test.js \
            -e BASE_URL=${{ steps.set-url.outputs.base_url }} \
            --out json=results/smoke-results.json \
            --summary-export=results/smoke-summary.json
        continue-on-error: false  # Smoke test failure = stop all subsequent tests

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results-${{ github.run_id }}
          path: results/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: LOAD TEST (only if smoke passed)
  # ─────────────────────────────────────────────────────────────────────────
  load-test:
    name: Load Test (HPA Validation)
    runs-on: ubuntu-latest
    needs: smoke-test
    if: >
      needs.smoke-test.outputs.smoke_passed == 'true' &&
      (github.event_name == 'schedule' ||
       github.event.inputs.test_type == 'load' ||
       github.event.inputs.test_type == 'hpa-validation')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/three-tier-eks-cluster-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Capture pre-test HPA state
        run: |
          echo "=== Pre-test HPA State ==="
          kubectl get hpa -n three-tier -o wide
          echo ""
          echo "=== Pre-test Pod Count ==="
          kubectl get pods -n three-tier | grep -E "(backend|frontend)"

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6

      - name: Run load test
        id: run-load
        run: |
          mkdir -p results
          TEST_SCRIPT="k6/load-tests/load-test.js"
          if [[ "${{ github.event.inputs.test_type }}" == "hpa-validation" ]]; then
            TEST_SCRIPT="k6/load-tests/hpa-validation.js"
          fi

          k6 run ${TEST_SCRIPT} \
            -e BASE_URL=http://${{ secrets.ALB_DNS }} \
            --out json=results/load-results.json \
            --summary-export=results/load-summary.json
        continue-on-error: true  # Don't fail the job — capture results first

      - name: Capture post-test HPA state
        if: always()
        run: |
          echo "=== Post-test HPA State ==="
          kubectl get hpa -n three-tier -o wide
          echo ""
          echo "=== Post-test Pod Count ==="
          kubectl get pods -n three-tier
          echo ""
          echo "=== HPA Events ==="
          kubectl describe hpa backend-hpa -n three-tier | grep -A 20 "Events:"

      - name: Parse and display results
        if: always()
        run: |
          if [ -f results/load-summary.json ]; then
            echo "=== LOAD TEST RESULTS ==="
            cat results/load-summary.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          metrics = data.get('metrics', {})
          print(f\"p95 Latency: {metrics.get('http_req_duration', {}).get('values', {}).get('p(95)', 0):.0f}ms\")
          print(f\"p99 Latency: {metrics.get('http_req_duration', {}).get('values', {}).get('p(99)', 0):.0f}ms\")
          print(f\"Error Rate:  {metrics.get('http_req_failed', {}).get('values', {}).get('rate', 0)*100:.2f}%\")
          print(f\"Total Reqs:  {metrics.get('http_reqs', {}).get('values', {}).get('count', 0):.0f}\")
            "
          fi

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-results-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Fail job if test thresholds not met
        if: steps.run-load.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: STRESS TEST (manual trigger only)
  # ─────────────────────────────────────────────────────────────────────────
  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event.inputs.test_type == 'stress'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6

      - name: Run stress test
        run: |
          mkdir -p results
          k6 run k6/load-tests/stress-test.js \
            -e BASE_URL=http://${{ secrets.ALB_DNS }} \
            --out json=results/stress-results.json \
            --summary-export=results/stress-summary.json
        continue-on-error: true  # Stress tests SHOULD hit thresholds — expected

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-results-${{ github.run_id }}
          path: results/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4: REPORT + ALERT ON REGRESSION
  # ─────────────────────────────────────────────────────────────────────────
  report:
    name: Performance Report
    runs-on: ubuntu-latest
    needs: [smoke-test, load-test]
    if: always()

    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results-${{ github.run_id }}"
          merge-multiple: true

      - name: Create performance report issue on regression
        if: needs.load-test.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Performance Regression Detected: ${new Date().toISOString().split('T')[0]}`,
              body: `
              ## Performance Regression Detected 📉

              **Test type:** Load Test
              **Run:** [Workflow #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              **Date:** ${new Date().toISOString()}

              ### What to investigate:
              1. Check recent deployments: \`git log --oneline -10\`
              2. Compare with last passing run artifacts
              3. Check Prometheus metrics: \`kubectl port-forward svc/kube-prometheus-stack-prometheus 9090:9090 -n monitoring\`
              4. Check backend logs: \`kubectl logs -l app=backend -n three-tier --since=1h\`

              ### Quick rollback:
              \`\`\`bash
              kubectl rollout undo deployment/backend -n three-tier
              kubectl rollout undo deployment/frontend -n three-tier
              \`\`\`
              `,
              labels: ["performance", "regression"]
            });
