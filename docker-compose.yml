# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Local Development Environment
# ─────────────────────────────────────────────────────────────────────────────
#
# PURPOSE: Run the full three-tier application locally WITHOUT AWS or Kubernetes.
# Perfect for: feature development, debugging, running integration tests.
#
# QUICK START:
#   docker compose up -d           # Start all services
#   docker compose logs -f         # Follow all logs
#   docker compose down            # Stop all services
#   docker compose down -v         # Stop + delete MongoDB data
#
# SERVICES:
#   MongoDB:  mongodb://admin:devpassword@localhost:27017
#   Backend:  http://localhost:5000
#   Frontend: http://localhost:3000
#
# DIFFERENCES FROM PRODUCTION:
#   - No TLS (production uses ALB with HTTPS)
#   - Single-node MongoDB (production uses StatefulSet)
#   - No HPA (Docker Compose doesn't auto-scale)
#   - Credentials in .env.docker (not K8s Secrets)
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# SHARED NETWORK
# ─────────────────────────────────────────────────────────────────────────────
# All services share one Docker network for inter-service communication.
# Mirrors: K8s ClusterIP services that allow pod-to-pod communication.
networks:
  three-tier-network:
    driver: bridge
    name: three-tier-network

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mongo-data:
    # Named volume persists MongoDB data across container restarts.
    # Mirrors: EBS PersistentVolumeClaim in k8s/mongo/statefulset.yaml
    # Remove with: docker compose down -v (destroys all local data)

# ─────────────────────────────────────────────────────────────────────────────
# SERVICES
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ════════════════════════════════════════════════════════════════════════════
  # MONGODB — Data Tier
  # ════════════════════════════════════════════════════════════════════════════
  mongo:
    image: mongo:6.0
    container_name: three-tier-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: devpassword
      MONGO_INITDB_DATABASE: three-tier
      # These are DEV credentials only — never use in production!

    ports:
      - "27017:27017"
      # Exposes MongoDB locally for: mongosh, MongoDB Compass, debugging
      # In production: MongoDB is ClusterIP only — not accessible outside cluster

    volumes:
      - mongo-data:/data/db
      # Persistent data volume (mirrors EBS PVC)

    networks:
      - three-tier-network

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      # backend depends_on this healthcheck — won't start until MongoDB is Ready

  # ════════════════════════════════════════════════════════════════════════════
  # BACKEND — API Tier (Node.js Express)
  # ════════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
      target: development
      # Multi-stage Dockerfile: 'development' stage = no minification, hot-reload
      # Production uses 'production' stage = minimal image

    container_name: three-tier-backend
    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://admin:devpassword@mongo:27017/three-tier?authSource=admin
      # 'mongo' = service name above (Docker Compose DNS resolution)
      # In K8s: mongo-service.three-tier.svc.cluster.local

    ports:
      - "5000:5000"
      # Access API at: http://localhost:5000/api/tasks

    volumes:
      - ./app/backend:/app
      - /app/node_modules
      # Bind mount for hot-reload: code changes reflect immediately
      # /app/node_modules is excluded (uses container's node_modules)

    depends_on:
      mongo:
        condition: service_healthy
        # Only start after MongoDB passes healthcheck
        # In K8s: initContainers handle dependency ordering

    networks:
      - three-tier-network

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ════════════════════════════════════════════════════════════════════════════
  # FRONTEND — Presentation Tier (React + Nginx)
  # ════════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      target: development
      args:
        # Backend URL for local development
        # In production: set to ALB DNS via GitHub Secret REACT_APP_BACKEND_URL
        REACT_APP_BACKEND_URL: http://localhost:5000

    container_name: three-tier-frontend
    restart: unless-stopped

    ports:
      - "3000:80"
      # Access frontend at: http://localhost:3000

    depends_on:
      backend:
        condition: service_healthy
        # Only start after backend passes healthcheck

    networks:
      - three-tier-network

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ════════════════════════════════════════════════════════════════════════════
  # MONGO EXPRESS — Database Admin UI (development only)
  # ════════════════════════════════════════════════════════════════════════════
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: three-tier-mongo-express
    restart: unless-stopped

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: devpassword
      ME_CONFIG_MONGODB_URL: mongodb://admin:devpassword@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: devpassword
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"

    ports:
      - "8081:8081"
      # Access Mongo Express at: http://localhost:8081
      # Username: admin, Password: devpassword

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - three-tier-network

    # Profile: only starts when explicitly requested
    # Run: docker compose --profile debug up -d
    profiles:
      - debug
