# ─────────────────────────────────────────────────────────────────────────────
# k8s/kyverno/policies/disallow-privilege-escalation.yaml — Pod Hardening
# ─────────────────────────────────────────────────────────────────────────────
#
# PURPOSE:
#   Privilege escalation (e.g. via setuid binaries) allows a container process
#   to gain more privileges than its parent process. Setting
#   allowPrivilegeEscalation: false and dropping ALL capabilities mitigates this.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must set allowPrivilegeEscalation to false and drop ALL capabilities.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - three-tier
      validate:
        message: "Privilege escalation is forbidden. Set securityContext.allowPrivilegeEscalation to false and drop ALL capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
