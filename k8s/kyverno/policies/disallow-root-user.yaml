# ─────────────────────────────────────────────────────────────────────────────
# k8s/kyverno/policies/disallow-root-user.yaml — Enforce Non-Root Execution
# ─────────────────────────────────────────────────────────────────────────────
#
# PURPOSE:
#   Containers should not run as root (UID 0). Running as root inside a container
#   increases the attack surface if a container breakout or kernel vulnerability
#   is exploited.
#
# POLICY ACTION: Enforce (blocks admission of offending pods)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
  annotations:
    policies.kyverno.io/title: Disallow Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must be required to run as non-root users. It mandates that
      runAsNonRoot is set to true and runAsUser is greater than 0.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - three-tier
      validate:
        message: "Running as root is forbidden. Set securityContext.runAsNonRoot to true."
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): true
            containers:
              - =(securityContext):
                  =(runAsNonRoot): true
                  =(runAsUser): ">0"
