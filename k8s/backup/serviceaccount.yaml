# ─────────────────────────────────────────────────────────────────────────────
# k8s/backup/serviceaccount.yaml — Velero Server ServiceAccount with IRSA
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-server
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: server
  annotations:
    # Bound to the IAM Role created in terraform/velero.tf
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/three-tier-eks-cluster-velero-role
