# ─────────────────────────────────────────────────────────────────────────────
# k8s/external-secrets/cluster-secret-store.yaml — AWS Secrets Manager Store
# ─────────────────────────────────────────────────────────────────────────────
#
# PURPOSE:
#   Cluster-scoped SecretStore that enables any namespace (e.g. three-tier)
#   to synchronize secrets from AWS Secrets Manager using IAM IRSA.
#
# HOW AUTHENTICATION WORKS:
#   1. ESO pod presents its Kubernetes projected ServiceAccount token
#   2. AWS STS validates the token via EKS OIDC provider
#   3. AWS STS returns temporary AWS credentials with the permissions
#      granted in terraform/external-secrets-iam.tf
#   4. Zero static secrets or AWS keys are stored inside Kubernetes!
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore

metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: aws-secrets-manager
    app.kubernetes.io/part-of: secrets-management

spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
