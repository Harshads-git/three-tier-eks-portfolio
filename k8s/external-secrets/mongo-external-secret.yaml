# ─────────────────────────────────────────────────────────────────────────────
# k8s/external-secrets/mongo-external-secret.yaml — Dynamic MongoDB Secret Sync
# ─────────────────────────────────────────────────────────────────────────────
#
# PURPOSE:
#   Synchronizes MongoDB root credentials from AWS Secrets Manager directly
#   into the native Kubernetes Secret `mongo-secret` in namespace `three-tier`.
#
# ADVANTAGES OVER COMMITTED SECRETS:
#   1. Zero Secrets in Git: No base64 encoded strings in version control.
#   2. Dynamic Rotation: If password is rotated in AWS Secrets Manager,
#      ESO automatically syncs the new value to K8s within refreshInterval (1h).
#   3. Enterprise Audit Trail: AWS CloudTrail logs every secret read action.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: mongo-external-secret
  namespace: three-tier
  labels:
    app.kubernetes.io/name: mongo-external-secret
    app.kubernetes.io/part-of: three-tier-platform

spec:
  # How often ESO polls AWS Secrets Manager for secret rotations
  refreshInterval: "1h"

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # Target native Kubernetes Secret created in namespace 'three-tier'
  target:
    name: mongo-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app: mongo
          app.kubernetes.io/managed-by: external-secrets

  data:
    - secretKey: mongo-root-username
      remoteRef:
        key: three-tier/production/mongodb
        property: username

    - secretKey: mongo-root-password
      remoteRef:
        key: three-tier/production/mongodb
        property: password

    - secretKey: MONGO_ROOT_USERNAME
      remoteRef:
        key: three-tier/production/mongodb
        property: username

    - secretKey: MONGO_ROOT_PASSWORD
      remoteRef:
        key: three-tier/production/mongodb
        property: password

    - secretKey: MONGO_DATABASE
      remoteRef:
        key: three-tier/production/mongodb
        property: database

    - secretKey: MONGO_URI
      remoteRef:
        key: three-tier/production/mongodb
        property: uri
