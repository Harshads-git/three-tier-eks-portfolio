# ─────────────────────────────────────────────────────────────────────────────
# k8s/external-secrets/backend-external-secret.yaml — Backend API Secret Sync
# ─────────────────────────────────────────────────────────────────────────────
#
# PURPOSE:
#   Synchronizes Express REST API authentication tokens, session signing keys,
#   and third-party API credentials from AWS Secrets Manager.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: backend-external-secret
  namespace: three-tier
  labels:
    app.kubernetes.io/name: backend-external-secret
    app.kubernetes.io/part-of: three-tier-platform

spec:
  refreshInterval: "1h"

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: backend-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app: backend
          app.kubernetes.io/managed-by: external-secrets

  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: three-tier/production/backend
        property: jwt_secret

    - secretKey: API_ENCRYPTION_KEY
      remoteRef:
        key: three-tier/production/backend
        property: encryption_key
