# ─────────────────────────────────────────────────────────────────────────────
# k8s/external-secrets/serviceaccount.yaml — IRSA ServiceAccount for ESO
# ─────────────────────────────────────────────────────────────────────────────
#
# PURPOSE:
#   Binds the External Secrets Operator Kubernetes pod to the AWS IAM role
#   created in terraform/external-secrets-iam.tf using AWS IRSA.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets-sa
    app.kubernetes.io/part-of: secrets-management
  annotations:
    # Set to the output from Terraform: external_secrets_role_arn
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/three-tier-eks-cluster-external-secrets-role
    eks.amazonaws.com/sts-regional-endpoints: "true"
