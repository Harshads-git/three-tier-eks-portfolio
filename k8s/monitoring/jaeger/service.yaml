# ─────────────────────────────────────────────────────────────────────────────
# k8s/monitoring/jaeger/service.yaml — Jaeger UI and Collector Services
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger-query
    app.kubernetes.io/part-of: observability-platform

spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: http-query
      port: 16686
      targetPort: query-ui
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger-collector
    app.kubernetes.io/part-of: observability-platform

spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
