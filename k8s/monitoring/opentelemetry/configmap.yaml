# ─────────────────────────────────────────────────────────────────────────────
# k8s/monitoring/opentelemetry/configmap.yaml — OpenTelemetry Collector Pipeline
# ─────────────────────────────────────────────────────────────────────────────
#
# PURPOSE:
#   Configures the OpenTelemetry Collector pipeline:
#   1. Receivers: Listens for OTLP gRPC (:4317) and HTTP (:4318) from workloads
#   2. Processors: Batches spans, protects memory, injects K8s metadata
#   3. Exporters: Dispatches traces to Jaeger (:4317) and logs
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: observability-platform

data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Memory Limiter protects the collector from crashing under high trace volume
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      # Batch processor buffers spans to minimize network roundtrips
      batch:
        send_batch_size: 1024
        timeout: 5s

    exporters:
      # Forward traces to in-cluster Jaeger collector via OTLP gRPC
      otlp/jaeger:
        endpoint: jaeger-collector.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

      # Debug logging exporter for span sampling
      logging:
        loglevel: info

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger, logging]
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888
