# ─────────────────────────────────────────────────────────────────────────────
# k8s/mongo/secret.yaml — Kubernetes Secret for MongoDB Credentials
# ─────────────────────────────────────────────────────────────────────────────
#
# WHAT IS A KUBERNETES SECRET?
# ----------------------------
# A Secret is a K8s object that stores sensitive data (passwords, tokens, certs).
# It differs from a ConfigMap in ONE key way: the values are base64-encoded.
#
# ⚠️  IMPORTANT SECURITY DISCLAIMER:
# ------------------------------------
# Base64 is NOT encryption. It is merely encoding.
# Anyone with kubectl access to the Secret can decode it instantly:
#   kubectl get secret mongo-secret -n three-tier -o jsonpath='{.data.MONGO_URI}' | base64 -d
#
# For true encryption at rest, enable Envelope Encryption in EKS:
#   - AWS KMS key encrypts the Secret's data in etcd
#   - See: https://docs.aws.amazon.com/eks/latest/userguide/envelope-encryption.html
#
# For production-grade secret management, use:
#   - AWS Secrets Manager + External Secrets Operator (ESO)
#   - ESO syncs Secrets from AWS SM into K8s Secrets automatically
#   - Secrets are rotated in AWS SM and updated in K8s without redeployment
#
# WHY COMMIT THIS FILE WITH PLACEHOLDER VALUES?
# ---------------------------------------------
# This file is committed with DUMMY base64 values for documentation purposes.
# In production CI/CD (Day 24), real values come from GitHub Secrets:
#   kubectl create secret generic mongo-secret \
#     --from-literal=MONGO_URI="${{ secrets.MONGO_URI }}" \
#     --from-literal=MONGO_ROOT_USERNAME="${{ secrets.MONGO_USER }}" \
#     --from-literal=MONGO_ROOT_PASSWORD="${{ secrets.MONGO_PASS }}" \
#     -n three-tier
#
# HOW TO GENERATE BASE64 VALUES:
# --------------------------------
# Linux/Mac:  echo -n "your-value" | base64
# PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("your-value"))
#
# CURRENT VALUES (local dev only — DO NOT use in production):
#   MONGO_ROOT_USERNAME: admin        → YWRtaW4=
#   MONGO_ROOT_PASSWORD: password123  → cGFzc3dvcmQxMjM=
#   MONGO_DATABASE:      tasksdb      → dGFza3NkYg==
#   MONGO_URI: mongodb://admin:password123@mongo-service.three-tier.svc.cluster.local:27017/tasksdb?authSource=admin
#     → bW9uZ29kYi8vYWRtaW46cGFzc3dvcmQxMjNAbW9uZ28tc2VydmljZS50aHJlZS10aWVyLnN2Yy5jbHVzdGVyLmxvY2FsOjI3MDE3L3Rhc2tzZGI/YXV0aFNvdXJjZT1hZG1pbg==
#
# HOW SECRETS ARE CONSUMED IN PODS:
# -----------------------------------
# Method 1 — Environment Variable (what we use in backend deployment.yaml):
#   env:
#     - name: MONGO_URI
#       valueFrom:
#         secretKeyRef:
#           name: mongo-secret    ← must match metadata.name below
#           key: MONGO_URI        ← must match data key below
#
# Method 2 — Mounted as a file (useful for TLS certs, SSH keys):
#   volumes:
#     - name: mongo-creds
#       secret:
#         secretName: mongo-secret
#   volumeMounts:
#     - name: mongo-creds
#       mountPath: /etc/mongo
#       readOnly: true
#   # Pod reads /etc/mongo/MONGO_URI file
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret

metadata:
  name: mongo-secret
  namespace: three-tier       # Must match the namespace all other resources use

  labels:
    app: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: three-tier-portfolio

  annotations:
    description: "MongoDB credentials for the three-tier application"
    # In production, this Secret is managed by External Secrets Operator
    # and synced from AWS Secrets Manager (not manually applied)

# type: Opaque is the generic Secret type for arbitrary key-value data.
# Other types: kubernetes.io/tls (TLS certs), kubernetes.io/dockerconfigjson (registry auth)
type: Opaque

# ─────────────────────────────────────────────────────────────────────────────
# DATA — All values MUST be base64-encoded
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️  These are PLACEHOLDER values for local dev / documentation.
#     Replace with real base64-encoded values in production.
#     In CI/CD (Day 24), these are injected from GitHub Secrets, not this file.
data:
  # MongoDB root username
  # Plain text: admin
  # base64: echo -n "admin" | base64
  MONGO_ROOT_USERNAME: YWRtaW4=

  # MongoDB root password
  # Plain text: password123
  # base64: echo -n "password123" | base64
  # ⚠️  CHANGE THIS in production! Use: openssl rand -base64 32
  MONGO_ROOT_PASSWORD: cGFzc3dvcmQxMjM=

  # MongoDB database name
  # Plain text: tasksdb
  # base64: echo -n "tasksdb" | base64
  MONGO_DATABASE: dGFza3NkYg==

  # Full MongoDB connection URI (used by backend pod)
  # Plain text: mongodb://admin:password123@mongo-service.three-tier.svc.cluster.local:27017/tasksdb?authSource=admin
  #
  # URI breakdown:
  #   mongodb://              → MongoDB protocol
  #   admin:password123@      → credentials (from MONGO_ROOT_USERNAME/PASSWORD above)
  #   mongo-service           → K8s Service name (defined in service.yaml)
  #   .three-tier             → namespace
  #   .svc.cluster.local      → K8s internal DNS suffix
  #   :27017                  → MongoDB default port
  #   /tasksdb                → database name
  #   ?authSource=admin       → authenticate against 'admin' database (required for root user)
  #
  # base64: echo -n "mongodb://admin:password123@mongo-service.three-tier.svc.cluster.local:27017/tasksdb?authSource=admin" | base64
  MONGO_URI: bW9uZ29kYi8vYWRtaW46cGFzc3dvcmQxMjNAbW9uZ28tc2VydmljZS50aHJlZS10aWVyLnN2Yy5jbHVzdGVyLmxvY2FsOjI3MDE3L3Rhc2tzZGI/YXV0aFNvdXJjZT1hZG1pbg==
