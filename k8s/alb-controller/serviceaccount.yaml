# ─────────────────────────────────────────────────────────────────────────────
# k8s/alb-controller/serviceaccount.yaml — IRSA for ALB Ingress Controller
# ─────────────────────────────────────────────────────────────────────────────
#
# WHAT IS IRSA? (IAM Roles for Service Accounts)
# ─────────────────────────────────────────────────────────────────────────────
# IRSA is the AWS-native way to give Kubernetes pods AWS IAM permissions
# WITHOUT storing AWS credentials (access keys) anywhere in the cluster.
#
# TRADITIONAL APPROACH (WRONG for K8s):
#   kubectl create secret generic aws-creds \
#     --from-literal=AWS_ACCESS_KEY_ID=AKIA...
#     --from-literal=AWS_SECRET_ACCESS_KEY=...
#   → Credentials in K8s Secrets (base64, not encrypted by default)
#   → Credentials never rotate automatically
#   → If leaked, grants permanent AWS access
#   → Violates AWS security best practices
#
# IRSA APPROACH (CORRECT):
#   1. Create an IAM Role with a trust policy (trusts K8s ServiceAccount)
#   2. Annotate the K8s ServiceAccount with the IAM Role ARN
#   3. K8s pod using this ServiceAccount automatically gets temporary
#      AWS credentials via the OIDC token (no keys stored anywhere!)
#
# HOW IRSA WORKS INTERNALLY:
# ─────────────────────────────────────────────────────────────────────────────
#   EKS cluster has an OIDC provider endpoint:
#     https://oidc.eks.us-east-1.amazonaws.com/id/<CLUSTER_ID>
#
#   The pod runs with a projected ServiceAccount token (JWT)
#     mounted at: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
#
#   AWS SDK in the pod calls: aws sts assume-role-with-web-identity
#     → Presents the JWT token to AWS STS
#     → STS verifies the JWT signature against the OIDC provider
#     → If trust policy matches → STS returns temporary credentials
#     → Credentials expire in 1 hour (auto-refreshed by SDK)
#
# THE TRUST POLICY (set in Terraform Day 13):
# ─────────────────────────────────────────────────────────────────────────────
# {
#   "Effect": "Allow",
#   "Principal": {
#     "Federated": "arn:aws:iam::123456789012:oidc-provider/oidc.eks.us-east-1.amazonaws.com/id/CLUSTER_ID"
#   },
#   "Action": "sts:AssumeRoleWithWebIdentity",
#   "Condition": {
#     "StringEquals": {
#       "oidc.eks.us-east-1.amazonaws.com/id/CLUSTER_ID:sub":
#         "system:serviceaccount:kube-system:aws-load-balancer-controller"
#     }
#   }
# }
# The condition ensures ONLY this specific ServiceAccount can assume the role.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount

metadata:
  name: aws-load-balancer-controller
  # The ALB Controller is installed in kube-system (not three-tier namespace)
  # It's cluster-wide infrastructure, not application-specific
  namespace: kube-system

  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: helm

  annotations:
    # ── THE CRITICAL ANNOTATION ──────────────────────────────────────────────
    # This annotation links the K8s ServiceAccount to the AWS IAM Role.
    # The EKS pod identity mutating webhook reads this annotation and
    # injects the OIDC token into the pod's volume mounts.
    #
    # Replace with your actual IAM Role ARN (created in Terraform Day 13)
    # Format: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/AmazonEKSLoadBalancerControllerRole

    description: >
      ServiceAccount for the AWS Load Balancer Controller.
      Uses IRSA (IAM Roles for Service Accounts) for AWS API access.
      The annotated IAM Role grants permissions to manage ALBs, NLBs,
      Target Groups, Security Groups, and related AWS resources.
